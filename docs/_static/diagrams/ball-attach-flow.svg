<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="Reballing a bare die: process flow">
<title>Reballing a bare die: process flow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(0,0)">
<text x="440.0" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Reballing a bare die: process flow</text>
<rect x="172.0" y="56" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Die with treated</text>
<text x="252.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">pads in a nest</text>
<rect x="360.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Thin smear of</text>
<text x="440.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">tacky flux</text>
<rect x="548.0" y="56" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Align stencil,</text>
<text x="628.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">brush balls into holes</text>
<rect x="548.0" y="160" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
