<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Silver epoxy dot joining a bare aluminium pad to a board pad">
<title>Silver epoxy dot joining a bare aluminium pad to a board pad</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(60,0)">
<text x="380" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Silver epoxy dot straight on the aluminium pad</text>
<rect x="60" y="60" width="640" height="70" rx="0" fill="#8d99a6" stroke="#1d2733" stroke-width="1" />
<text x="380" y="100" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">die (face down)</text>
<rect x="60" y="130" width="220" height="30" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="480" y="130" width="220" height="30" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="264" y="130" width="232" height="16" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<polygon points="284.0,147.0 476.0,147.0 476.0,160.0 492.0,176.0 500.0,230.0 486.0,300.0 274.0,300.0 260.0,230.0 268.0,176.0 284.0,160.0" fill="#5a5a5a" stroke="#1d2733" stroke-width="1" stroke-linejoin="round"/>
<line x1="286" y1="147" x2="474" y2="147" stroke="#b3261e" stroke-width="3" />
<rect x="240" y="300" width="280" height="16" rx="0" fill="#e0b020" stroke="#1d2733" stroke-width="1" />
<rect x="60" y="316" width="640" height="70" rx="0" fill="#3f7f4f" stroke="#1d2733" stroke-width="1" />
<text x="380" y="356" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">board or flex circuit</text>
<line x1="566" y1="184" x2="440" y2="147" stroke="#b3261e" stroke-width="0.8" />
<circle cx="440" cy="147" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="570" y="180" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">native oxide stays under the epoxy:</text>
<text x="570" y="196" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">high, drifting contact resistance</text>
<line x1="566" y1="244" x2="470" y2="240" stroke="#1d2733" stroke-width="0.8" />
<circle cx="470" cy="240" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="570" y="240" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">silver-filled epoxy dot,</text>
<text x="570" y="256" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">about 200 µm across</text>
<line x1="566" y1="292" x2="505" y2="308" stroke="#1d2733" stroke-width="0.8" />
<circle cx="505" cy="308" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="570" y="296" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">gold-finished copper pad</text>
<line x1="229" y1="194" x2="272" y2="139" stroke="#1d2733" stroke-width="0.8" />
<circle cx="272" cy="139" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="225" y="190" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Al pad, untreated or</text>
<text x="225" y="206" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">scrubbed while the epoxy is wet</text>
<line x1="229" y1="266" x2="200" y2="240" stroke="#1d2733" stroke-width="0.8" />
<circle cx="200" cy="240" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="225" y="262" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">air gap: no underfill, so the</text>
<text x="225" y="278" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">dots carry all the load</text>
<text x="380" y="436" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Not to scale.</text>
</g>
</svg>
