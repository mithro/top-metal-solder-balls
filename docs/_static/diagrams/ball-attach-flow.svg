<text x="628.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">direct-heat stencil on)</text>
<rect x="360.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Heat from below until</text>
<text x="440.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">balls go shiny and round</text>
<rect x="172.0" y="160" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Clean flux,</text>
<text x="252.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">prod each ball</text>
