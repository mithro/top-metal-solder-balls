<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="Home zincate and electroless nickel: process flow">
<title>Home zincate and electroless nickel: process flow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(0,0)">
<text x="440.0" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Home zincate and electroless nickel: process flow</text>
<rect x="78.0" y="56" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="158.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Stick die to a holder,</text>
<text x="158.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">paint edges and back</text>
<rect x="266.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="346.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Degrease</text>
<text x="346.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(IPA, detergent)</text>
<rect x="454.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="534.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zincate dip</text>
<text x="534.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">15 to 30 s, room temp</text>
<rect x="642.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="722.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Strip in nitric acid,</text>
<text x="722.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">zincate again (optional)</text>
<rect x="642.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="722.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Electroless nickel kit</text>
<text x="722.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">85 to 90 °C, 10 to 20 min</text>
<rect x="454.0" y="160" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="534.0" y="196.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rinse and dry</text>
<rect x="266.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="346.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Flux and reball</text>
<text x="346.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">the same day</text>
<rect x="78.0" y="160" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="158.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Test: continuity,</text>
<text x="158.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">push on the balls</text>
<line x1="238.0" y1="88.0" x2="264.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="426.0" y1="88.0" x2="452.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="614.0" y1="88.0" x2="640.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="722.0" y1="120" x2="722.0" y2="158" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="642.0" y1="192.0" x2="616.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="454.0" y1="192.0" x2="428.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="266.0" y1="192.0" x2="240.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="440.0" y="270" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Distilled water rinse between every wet step. Times are starting points, not a proven recipe.</text>
</g>
</svg>
