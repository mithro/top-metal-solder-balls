<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Electroless nickel immersion gold UBM with solder ball">
<title>Electroless nickel immersion gold UBM with solder ball</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(60,0)">
<circle cx="380" cy="189.0" r="135" fill="#d9dde2" stroke="#1d2733" stroke-width="1"/>
<ellipse cx="335" cy="134.0" rx="26" ry="16" fill="#ffffff" opacity="0.6"/>
<rect x="60" y="320" width="640" height="70" rx="0" fill="#8d99a6" stroke="#1d2733" stroke-width="1" />
<rect x="60" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="480" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="264" y="300" width="232" height="20" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<text x="380" y="362" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">inter-metal dielectric, lower metals, silicon</text>
<text x="380" y="436" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Horizontal: about 1 px per µm. Layer thicknesses greatly exaggerated.</text>
<polygon points="280.0,300.0 480.0,300.0 480.0,280.0 488.0,280.0 488.0,272.0 485.0,270.0 275.0,270.0 272.0,272.0 272.0,280.0 280.0,280.0" fill="#6f7f8f" stroke="#1d2733" stroke-width="1" stroke-linejoin="round"/>
<line x1="274" y1="270" x2="486" y2="270" stroke="#e0b020" stroke-width="3" />
<line x1="282" y1="299" x2="478" y2="299" stroke="#8b3fa0" stroke-width="2" />
<line x1="556" y1="134" x2="480" y2="170" stroke="#1d2733" stroke-width="0.8" />
<circle cx="480" cy="170" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="560" y="130" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">SAC solder ball,</text>
<text x="560" y="146" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">250 µm</text>
<line x1="566" y1="189" x2="484" y2="269" stroke="#1d2733" stroke-width="0.8" />
<circle cx="484" cy="269" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="570" y="185" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">immersion Au, 0.05 to 0.1 µm</text>
<text x="570" y="201" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(dissolves into the solder)</text>
<line x1="566" y1="238" x2="460" y2="286" stroke="#1d2733" stroke-width="0.8" />
<circle cx="460" cy="286" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="570" y="234" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">electroless Ni-P, about 5 µm:</text>
<text x="570" y="250" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">barrier and wettable layer</text>
<line x1="229" y1="204" x2="274" y2="275" stroke="#1d2733" stroke-width="0.8" />
<circle cx="274" cy="275" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="225" y="200" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Ni mushrooms about 5 µm</text>
<text x="225" y="216" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">over the passivation edge</text>
<line x1="229" y1="254" x2="310" y2="299" stroke="#8b3fa0" stroke-width="0.8" />
<circle cx="310" cy="299" r="2" fill="#8b3fa0" stroke="#8b3fa0" stroke-width="1"/>
<text x="225" y="250" font-size="13" text-anchor="end" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">zincate seed layer on Al</text>
<text x="225" y="266" font-size="13" text-anchor="end" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(0.3 to 0.4 µm of Al consumed)</text>
<text x="380" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ENIG under bump metal on the Al pad</text>
</g>
</svg>
