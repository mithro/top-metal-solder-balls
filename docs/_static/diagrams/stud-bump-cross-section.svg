<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Gold stud bump used as under bump metal">
<title>Gold stud bump used as under bump metal</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="880" height="450" fill="#ffffff"/>
<g transform="translate(60,0)">
<circle cx="380" cy="173" r="125" fill="#d9dde2" stroke="#1d2733" stroke-width="1"/>
<rect x="60" y="320" width="640" height="70" rx="0" fill="#8d99a6" stroke="#1d2733" stroke-width="1" />
<rect x="60" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="480" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="264" y="300" width="232" height="20" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<text x="380" y="362" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">inter-metal dielectric, lower metals, silicon</text>
<text x="380" y="436" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Horizontal: about 1 px per um. Layer thicknesses greatly exaggerated.</text>
<rect x="330" y="258" width="100" height="42" rx="14" fill="#b9a7c9" stroke="none" stroke-width="1" />
<rect x="360" y="236" width="40" height="30" rx="10" fill="#b9a7c9" stroke="none" stroke-width="1" />
<rect x="340" y="268" width="80" height="32" rx="10" fill="#e0b020" stroke="#1d2733" stroke-width="1" />
<rect x="368" y="246" width="24" height="24" rx="6" fill="#e0b020" stroke="#1d2733" stroke-width="1" />
<line x1="344" y1="300" x2="416" y2="300" stroke="#8b3fa0" stroke-width="3" />
<line x1="556" y1="116" x2="470" y2="150" stroke="#1d2733" stroke-width="0.8" />
<circle cx="470" cy="150" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="560" y="120" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">solder ball</text>
<line x1="566" y1="204" x2="410" y2="282" stroke="#1d2733" stroke-width="0.8" />
<circle cx="410" cy="282" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="570" y="200" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Au stud from a ball bonder,</text>
<text x="570" y="216" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">60 to 120 um across</text>
<line x1="566" y1="254" x2="426" y2="266" stroke="#8b3fa0" stroke-width="0.8" />
<circle cx="426" cy="266" r="2" fill="#8b3fa0" stroke="#8b3fa0" stroke-width="1"/>
<text x="570" y="250" font-size="13" text-anchor="start" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">AuSn4 forms around the stud:</text>
<text x="570" y="266" font-size="13" text-anchor="start" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">brittle when gold is plentiful</text>
<line x1="229" y1="184" x2="360" y2="300" stroke="#8b3fa0" stroke-width="0.8" />
<circle cx="360" cy="300" r="2" fill="#8b3fa0" stroke="#8b3fa0" stroke-width="1"/>
<text x="225" y="180" font-size="13" text-anchor="end" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Au-Al intermetallic grows</text>
<text x="225" y="196" font-size="13" text-anchor="end" fill="#8b3fa0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">above about 200 C</text>
<line x1="229" y1="244" x2="305" y2="300" stroke="#b3261e" stroke-width="0.8" />
<circle cx="305" cy="300" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="225" y="240" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">bare Al beside the stud:</text>
<text x="225" y="256" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">not wetted, not sealed</text>
<text x="380" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Gold stud bump as the solderable surface</text>
</g>
</svg>
