<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="What a zincate dip does to an aluminium pad">
<title>What a zincate dip does to an aluminium pad</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(0,0)">
<text x="440.0" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">What a zincate dip does to an aluminium pad</text>
<rect x="172.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alkaline bath</text>
<text x="252.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">dissolves the oxide</text>
<rect x="360.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zinc swaps places</text>
<text x="440.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">with bare aluminium</text>
<rect x="548.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Film stops growing at</text>
<text x="628.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">tens of nanometres</text>
<rect x="548.0" y="160" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zinc shields the pad</text>
<text x="628.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">through the rinse</text>
<rect x="360.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Nickel bath: nickel</text>
<text x="440.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">replaces the zinc</text>
<line x1="332.0" y1="88.0" x2="358.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="520.0" y1="88.0" x2="546.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="628.0" y1="120" x2="628.0" y2="158" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="548.0" y1="192.0" x2="522.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="440.0" y="270" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2 Al + 3 Zn(2+) gives 2 Al(3+) + 3 Zn. Nickel then keeps growing on itself.</text>
</g>
</svg>
