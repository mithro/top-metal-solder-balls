<text x="500" y="166" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">for probing or wire bonding</text>
<line x1="496" y1="334" x2="319.0" y2="313.0" stroke="#1d2733" stroke-width="0.8" />
<circle cx="319.0" cy="313.0" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="500" y="330" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">6 large pads, roughly 220 µm square</text>
<text x="500" y="346" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">on a 0.4 mm grid (2 x 3)</text>
<text x="500" y="430" font-size="13" text-anchor="start" fill="#8a6fb0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">traces join large pads to small pads</text>
<text x="500" y="446" font-size="13" text-anchor="start" fill="#8a6fb0" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(not drawn: pairing not verified)</text>
<line x1="496" y1="516" x2="448.0" y2="520.0" stroke="#1d2733" stroke-width="0.8" />
