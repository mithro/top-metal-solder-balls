<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="Silver mirror: process flow">
<title>Silver mirror: process flow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(0,0)">
<text x="440.0" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Silver mirror: process flow</text>
<rect x="172.0" y="56" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Mask everything</text>
<text x="252.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">except the pads</text>
<rect x="360.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Mix fresh Tollens</text>
<text x="440.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">reagent, small batch</text>
<rect x="548.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Add glucose,</text>
<text x="628.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">immerse die</text>
<rect x="548.0" y="160" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rinse, remove mask</text>
<text x="628.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(lifts stray silver)</text>
<rect x="360.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Destroy leftover</text>
<text x="440.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">reagent with acid</text>
<rect x="172.0" y="160" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Join with silver epoxy</text>
<text x="252.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">or low-temp solder</text>
<line x1="332.0" y1="88.0" x2="358.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="520.0" y1="88.0" x2="546.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="628.0" y1="120" x2="628.0" y2="158" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="548.0" y1="192.0" x2="522.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="360.0" y1="192.0" x2="334.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="440.0" y="270" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Never store Tollens reagent: it forms explosive silver nitride on standing.</text>
</g>
</svg>
