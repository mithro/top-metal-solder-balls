<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Silver mirror deposit covering pads and passivation">
<title>Silver mirror deposit covering pads and passivation</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(60,0)">
<text x="380" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Silver mirror: the silver goes everywhere</text>
<rect x="60" y="320" width="640" height="70" rx="0" fill="#8d99a6" stroke="#1d2733" stroke-width="1" />
<text x="380" y="362" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">inter-metal dielectric, lower metals, silicon</text>
<rect x="150" y="300" width="180" height="20" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<rect x="430" y="300" width="180" height="20" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<rect x="60" y="280" width="110" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="310" y="280" width="140" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="590" y="280" width="110" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<polygon points="60.0,280.0 170.0,280.0 170.0,300.0 310.0,300.0 310.0,280.0 450.0,280.0 450.0,300.0 590.0,300.0 590.0,280.0 700.0,280.0 700.0,275.0 585.0,275.0 585.0,295.0 455.0,295.0 455.0,275.0 305.0,275.0 305.0,295.0 175.0,295.0 175.0,275.0 60.0,275.0" fill="#f2f2f2" stroke="#1d2733" stroke-width="0.8" stroke-linejoin="round"/>
<line x1="556" y1="154" x2="520" y2="296" stroke="#1d2733" stroke-width="0.8" />
<circle cx="520" cy="296" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="560" y="150" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">silver film about 0.1 µm, on</text>
<text x="560" y="166" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">pads and passivation alike</text>
<line x1="566" y1="219" x2="380" y2="276" stroke="#b3261e" stroke-width="0.8" />
<circle cx="380" cy="276" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="570" y="215" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">bridge between pads: must be</text>
<text x="570" y="231" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">masked or removed</text>
<line x1="229" y1="164" x2="240" y2="306" stroke="#b3261e" stroke-width="0.8" />
<circle cx="240" cy="306" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="225" y="160" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">alkaline bath also etches</text>
<text x="225" y="176" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">the aluminium</text>
<line x1="184" y1="232" x2="200" y2="299" stroke="#b3261e" stroke-width="0.8" />
<circle cx="200" cy="299" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="180" y="228" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">oxide stays under the silver</text>
<text x="180" y="244" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">unless removed first</text>
<text x="380" y="436" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two neighbouring pads. Not to scale.</text>
</g>
</svg>
