<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="Aluminium solder paste: process flow">
<title>Aluminium solder paste: process flow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<g transform="translate(0,0)">
<text x="440.0" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Aluminium solder paste: process flow</text>
<rect x="172.0" y="56" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Die in a nest</text>
<text x="252.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">under a stencil</text>
<rect x="360.0" y="56" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Print aluminium</text>
<text x="440.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">solder paste</text>
<rect x="548.0" y="56" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="84.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Hot plate reflow,</text>
<text x="628.0" y="99.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">reach temperature fast</text>
<rect x="548.0" y="160" width="160" height="64" rx="8" fill="#dbeaf7" stroke="#1d2733" stroke-width="1" />
<text x="628.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rinse residue off</text>
<text x="628.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">in hot water</text>
<rect x="360.0" y="160" width="160" height="64" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="440.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Inspect bumps,</text>
<text x="440.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">check pad still there</text>
<rect x="172.0" y="160" width="160" height="64" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="252.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Optional: reball on</text>
<text x="252.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">top of the tinned pads</text>
<line x1="332.0" y1="88.0" x2="358.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="520.0" y1="88.0" x2="546.0" y2="88.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="628.0" y1="120" x2="628.0" y2="158" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="548.0" y1="192.0" x2="522.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="360.0" y1="192.0" x2="334.0" y2="192.0" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
</g>
</svg>
