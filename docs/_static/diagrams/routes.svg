<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Routes from bare aluminium pad to solder ball">
<title>Routes from bare aluminium pad to solder ball</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="820" height="470" fill="#ffffff"/>
<g transform="translate(0,0)">
<text x="410" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two steps: make the pad solderable, then add the solder</text>
<text x="170" y="62" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Step 1: under bump metal</text>
<text x="650" y="62" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Step 2: solder</text>
<rect x="40" y="90" width="260" height="40" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="170" y="115" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Electroless Ni / Au (zincate)</text>
<rect x="40" y="150" width="260" height="40" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="170" y="175" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Sputtered Ti / Ni / Au</text>
<rect x="40" y="210" width="260" height="40" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="170" y="235" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Gold stud bump</text>
<rect x="40" y="270" width="260" height="40" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="170" y="295" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Commercial wafer bumping</text>
<rect x="540" y="90" width="220" height="40" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="650" y="115" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Stencil ball placement</text>
<rect x="540" y="170" width="220" height="40" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="650" y="195" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Laser solder jetting</text>
<rect x="540" y="250" width="220" height="40" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="650" y="275" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Paste printing</text>
<line x1="300" y1="110" x2="538" y2="110" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="110" x2="538" y2="190" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="110" x2="538" y2="270" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="170" x2="538" y2="110" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="170" x2="538" y2="190" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="170" x2="538" y2="270" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="300" y1="230" x2="538" y2="195" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<line x1="300" y1="290" x2="538" y2="115" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="350" width="260" height="40" rx="8" fill="#f6d5d2" stroke="#1d2733" stroke-width="1" />
<text x="170" y="375" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Ultrasonic / active solder, Sn-Zn</text>
<rect x="540" y="350" width="220" height="40" rx="8" fill="#f6d5d2" stroke="#1d2733" stroke-width="1" />
<text x="650" y="375" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Solder straight on Al</text>
<line x1="300" y1="370" x2="538" y2="370" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="410" y="425" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Solid arrows: established combinations. Dashed: works for prototypes or unproven on thin pads.</text>
<text x="410" y="445" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Green: gives a real barrier layer. Orange: no barrier. Red: no under bump metal at all.</text>
</g>
</svg>
