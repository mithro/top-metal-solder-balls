<text x="500" y="520" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">die 1.94 x 2.53 mm, no transistors</text>
<text x="410" y="600" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Dimensions are measured off an image at about 2.5 µm per pixel, so treat them as plus or minus 10%.</text>
