<rect x="105.0" y="218.0" width="24.0" height="12.0" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<rect x="105.0" y="240.0" width="24.0" height="12.0" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
