<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Home routes from bare aluminium pad to solder ball">
<title>Home routes from bare aluminium pad to solder ball</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="860" height="500" fill="#ffffff"/>
<g transform="translate(0,0)">
<text x="430" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Home routes: make the pad solderable, then add the solder</text>
<text x="180" y="62" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Step 1: treat the Al pad</text>
<text x="680" y="62" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Step 2: add the solder</text>
<rect x="40" y="90" width="280" height="44" rx="8" fill="#e6f2de" stroke="#1d2733" stroke-width="1" />
<text x="180" y="117" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zincate + electroless nickel kit</text>
<rect x="40" y="160" width="280" height="44" rx="8" fill="#f9dfc8" stroke="#1d2733" stroke-width="1" />
<text x="180" y="187" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Aluminium solder paste or flux</text>
<rect x="40" y="230" width="280" height="44" rx="8" fill="#f6d5d2" stroke="#1d2733" stroke-width="1" />
<text x="180" y="257" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Silver: mirror or displacement</text>
<rect x="560" y="90" width="240" height="44" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="680" y="117" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Reballing stencil + 0.25 mm balls</text>
<rect x="560" y="160" width="240" height="44" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="680" y="187" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Paste already leaves a bump</text>
<rect x="560" y="300" width="240" height="44" rx="8" fill="#e9f0f7" stroke="#1d2733" stroke-width="1" />
<text x="680" y="327" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Silver epoxy dots (no solder)</text>
<line x1="320" y1="112" x2="558" y2="112" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="320" y1="182" x2="558" y2="182" stroke="#1d2733" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="320" y1="176" x2="558" y2="120" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<line x1="320" y1="252" x2="558" y2="126" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<line x1="320" y1="258" x2="558" y2="316" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="300" width="280" height="44" rx="8" fill="#eeeeee" stroke="#1d2733" stroke-width="1" />
<text x="180" y="327" font-size="13" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Nothing (bare Al, scratched)</text>
<line x1="320" y1="322" x2="558" y2="322" stroke="#1d2733" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="430" y="400" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Green: real nickel barrier, most steps. Orange: fewest steps, unproven on thin pads.</text>
<text x="430" y="420" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Red: silver dissolves in molten solder, so it suits epoxy better than solder.</text>
<text x="430" y="440" font-size="12" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Dashed arrows: expected to be marginal.</text>
</g>
</svg>
