<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Solder wetted directly onto aluminium">
<title>Solder wetted directly onto aluminium</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="880" height="450" fill="#ffffff"/>
<g transform="translate(60,0)">
<circle cx="380" cy="205.08424788266177" r="135" fill="#d9dde2" stroke="#1d2733" stroke-width="1"/>
<ellipse cx="335" cy="150.08424788266177" rx="26" ry="16" fill="#ffffff" opacity="0.6"/>
<rect x="60" y="320" width="640" height="70" rx="0" fill="#8d99a6" stroke="#1d2733" stroke-width="1" />
<rect x="60" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="480" y="280" width="220" height="40" rx="0" fill="#7fb77e" stroke="#1d2733" stroke-width="1" />
<rect x="264" y="300" width="232" height="20" rx="0" fill="#c9d6e2" stroke="#1d2733" stroke-width="1" />
<text x="380" y="362" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">inter-metal dielectric, lower metals, silicon</text>
<text x="380" y="436" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Horizontal: about 1 px per um. Layer thicknesses greatly exaggerated.</text>
<line x1="284" y1="300" x2="476" y2="300" stroke="#b3261e" stroke-width="3" />
<line x1="556" y1="154" x2="480" y2="200" stroke="#1d2733" stroke-width="0.8" />
<circle cx="480" cy="200" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="560" y="150" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Sn-based solder, wetted with</text>
<text x="560" y="166" font-size="13" text-anchor="start" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ultrasonic or active alloy</text>
<line x1="566" y1="234" x2="440" y2="300" stroke="#b3261e" stroke-width="0.8" />
<circle cx="440" cy="300" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="570" y="230" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Sn directly on Al: no barrier,</text>
<text x="570" y="246" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Al dissolves, galvanic couple</text>
<line x1="229" y1="204" x2="272" y2="310" stroke="#1d2733" stroke-width="0.8" />
<circle cx="272" cy="310" r="2" fill="#1d2733" stroke="#1d2733" stroke-width="1"/>
<text x="225" y="200" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">only about 1.1 um of Al to</text>
<text x="225" y="216" font-size="13" text-anchor="end" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">survive cavitation and tin</text>
<line x1="229" y1="251" x2="282" y2="298" stroke="#b3261e" stroke-width="0.8" />
<circle cx="282" cy="298" r="2" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="225" y="255" font-size="13" text-anchor="end" fill="#b3261e" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">pad edge not sealed</text>
<text x="380" y="30" font-size="16" text-anchor="middle" fill="#1d2733" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Direct soldering to the Al pad (no under bump metal)</text>
</g>
</svg>
