<text x="252.0" y="188.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Strip resist, etch</text>
<text x="252.0" y="203.0" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">seed Cu and Ti</text>
